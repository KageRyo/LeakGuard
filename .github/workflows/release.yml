name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and check version
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/package-release.py
      - name: Smoke freshly extracted archive
        shell: bash
        run: |
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -f "$archive" ] || continue
            case "$archive" in
              *.tar.gz) sums="${archive%.tar.gz}.sha256" ;;
              *.zip) sums="${archive%.zip}.sha256" ;;
            esac
            python3 scripts/smoke-release.py "$archive" "$sums"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leakguard-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: leakguard-*
          path: dist
          merge-multiple: true
      - name: Combine checksums and verify assets
        shell: bash
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --draft --title "LeakGuard $RELEASE_TAG" --generate-notes
