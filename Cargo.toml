[package]
name = "leakguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight secret and credential leakage guard for CI pipelines"
license = "Apache-2.0"
repository = "https://github.com/KageRyo/LeakGuard"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
